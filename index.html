<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="明细计算器">
    <title>明细加法计算器</title>
    
    <!-- 引入 Tailwind CSS 快速渲染界面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        /* 防止 iOS 点击输入框时自动放大页面 */
        input {
            font-size: 16px !important;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col font-sans">

    <!-- 顶部导航栏 -->
    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-lg font-bold">🧮 连续加法明细计算器</h1>
        <button onclick="clearAllRecords()" class="text-xs bg-emerald-700 hover:bg-emerald-800 px-3 py-1.5 rounded-lg border border-emerald-500 font-medium transition">
            清空列表
        </button>
    </header>

    <!-- 主体区域 -->
    <main class="flex-1 p-4 max-w-lg mx-auto w-full flex flex-col space-y-4">

        <!-- 输入区域 -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100">
            <form id="addForm" class="space-y-3">
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <span class="absolute left-3 top-2.5 text-gray-400 font-bold">+</span>
                        <input type="number" step="any" id="numberInput" placeholder="输入数字（如 125.5）" required class="w-full bg-gray-50 border border-gray-300 rounded-xl pl-8 pr-3 py-2 text-lg font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <button type="submit" class="bg-emerald-600 active:bg-emerald-700 text-white font-bold px-5 py-2 rounded-xl shadow-md transition">
                        加一笔
                    </button>
                </div>
                <div>
                    <input type="text" id="remarkInput" placeholder="添加备注（可选，如：快递费）" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
            </form>
        </div>

        <!-- 明细列表区域 -->
        <div class="flex-1 bg-white rounded-2xl shadow-sm p-4 border border-gray-100 flex flex-col min-h-[300px]">
            <div class="flex justify-between items-center pb-3 mb-2 border-b text-xs text-gray-400 font-medium">
                <span>序号 / 备注</span>
                <span>数值</span>
            </div>

            <!-- 列表容器 -->
            <div id="itemList" class="flex-1 overflow-y-auto space-y-2 max-h-[50vh] pr-1">
                <p class="text-center text-gray-400 text-sm py-12">暂无数字，在上方输入开始相加</p>
            </div>
        </div>

    </main>

    <!-- 底部固定汇总栏 -->
    <footer class="bg-white border-t border-gray-200 p-4 sticky bottom-0 shadow-lg">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div>
                <div class="text-xs text-gray-500">总笔数</div>
                <div id="countText" class="text-sm font-semibold text-gray-700">共 0 笔</div>
            </div>
            <div class="text-right">
                <div class="text-xs text-gray-500">合计总和</div>
                <div id="totalText" class="text-2xl font-black text-emerald-600">0</div>
            </div>
        </div>
    </footer>

    <!-- 逻辑脚本 -->
    <script>
        const STORAGE_KEY = 'offline_calculator_items';

        // 获取本地数据
        function getItems() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        }

        // 保存本地数据
        function saveItems(items) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }

        // 渲染列表与自动计算总和
        function render() {
            const items = getItems();
            const listEl = document.getElementById('itemList');
            const totalEl = document.getElementById('totalText');
            const countEl = document.getElementById('countText');

            if (items.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-400 text-sm py-12">暂无数字，在上方输入开始相加</p>';
                totalEl.innerText = '0';
                countEl.innerText = '共 0 笔';
                return;
            }

            let sum = 0;
            // 倒序排列，最新输入的在最上面；序号保持正确顺序
            listEl.innerHTML = items.map((item, index) => {
                const val = parseFloat(item.val);
                sum += val;
                const displayIndex = items.length - index;

                return `
                    <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-xl hover:bg-gray-100 transition">
                        <div class="flex items-center gap-3">
                            <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold flex items-center justify-center">${displayIndex}</span>
                            <div>
                                ${item.remark ? `<div class="text-xs text-gray-600">${item.remark}</div>` : `<div class="text-xs text-gray-400">无备注</div>`}
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-gray-800 text-base">+${val.toLocaleString()}</span>
                            <button onclick="deleteItem(${index})" class="text-gray-300 hover:text-red-500 text-xs p-1">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            // 更新汇总数据 (防止浮点数精度误差)
            totalEl.innerText = Number(sum.toFixed(4)).toLocaleString();
            countEl.innerText = `共 ${items.length} 笔`;
        }

        // 表单提交事件
        document.getElementById('addForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const numInput = document.getElementById('numberInput');
            const remarkInput = document.getElementById('remarkInput');

            const val = numInput.value;
            const remark = remarkInput.value.trim();

            if (!val) return;

            const items = getItems();
            items.unshift({ val, remark }); // 插到头部
            saveItems(items);

            numInput.value = '';
            remarkInput.value = '';
            numInput.focus(); // 继续保持输入框焦点，方便连续输入

            render();
        });

        // 删除单条记录
        function deleteItem(index) {
            const items = getItems();
            items.splice(index, 1);
            saveItems(items);
            render();
        }

        // 清空全部记录
        function clearAllRecords() {
            if (confirm('确定要清空目前所有的计算明细吗？')) {
                localStorage.removeItem(STORAGE_KEY);
                render();
            }
        }

        // 页面初始化
        window.onload = render;
    </script>
</body>
</html>
