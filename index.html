<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="明细计算器">
    <title>明细计算器</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        input { font-size: 16px !important; }

        @media print {
            header, .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .print-container { border: none !important; box-shadow: none !important; }
            #itemList { max-height: none !important; overflow: visible !important; }
            .item-card { border: 1px solid #e5e7eb !important; break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col font-sans">

    <!-- 顶部导航栏 -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center no-print">
        <h1 class="text-base font-bold flex items-center gap-1.5">🧮 流水明细计算器</h1>
        <div class="flex gap-2">
            <button id="pdfBtn" type="button" class="text-xs bg-indigo-700 active:bg-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-400 font-medium transition">
                📄 保存 PDF
            </button>
            <button onclick="clearAllRecords()" class="text-xs bg-red-500 active:bg-red-700 px-3 py-1.5 rounded-lg font-medium transition">
                清空
            </button>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="flex-1 p-4 max-w-lg mx-auto w-full flex flex-col space-y-4">

        <!-- 输入与运算操作区 -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100 space-y-3 no-print">
            <div>
                <input type="number" step="any" id="numberInput" placeholder="输入数字..." required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-xl font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="grid grid-cols-4 gap-2">
                <button onclick="addOp('+')" class="bg-indigo-600 active:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-lg shadow transition">
                    + 加
                </button>
                <button onclick="addOp('-')" class="bg-emerald-600 active:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-lg shadow transition">
                    - 减
                </button>
                <button onclick="addOp('×')" class="bg-amber-500 active:bg-amber-600 text-white font-bold py-2.5 rounded-xl text-lg shadow transition">
                    × 乘
                </button>
                <button onclick="addOp('÷')" class="bg-rose-500 active:bg-rose-600 text-white font-bold py-2.5 rounded-xl text-lg shadow transition">
                    ÷ 除
                </button>
            </div>

            <div>
                <input type="text" id="remarkInput" placeholder="添加备注说明（选填，如：肉糕、鳊鱼）" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
        </div>

        <!-- 明细列表区域 -->
        <div class="print-container bg-white rounded-2xl shadow-sm p-4 border border-gray-100 flex flex-col min-h-[300px]">
            <div class="hidden print:block mb-4 border-b pb-2">
                <h2 class="text-xl font-bold">计算明细清单</h2>
                <p class="text-xs text-gray-500" id="printTime"></p>
            </div>

            <div class="flex justify-between items-center pb-2 mb-2 border-b text-xs text-gray-400 font-medium">
                <span>步骤 / 运算 / 备注</span>
                <span>当前累积结果</span>
            </div>

            <div id="itemList" class="flex-1 overflow-y-auto space-y-2 max-h-[50vh] pr-1">
                <p class="text-center text-gray-400 text-sm py-12">暂无计算记录，请输入数字进行运算</p>
            </div>
        </div>

    </main>

    <!-- 底部固定汇总栏 -->
    <footer class="bg-white border-t border-gray-200 p-4 sticky bottom-0 shadow-lg">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div>
                <div class="text-xs text-gray-500">步骤统计</div>
                <div id="countText" class="text-sm font-semibold text-gray-700">共 0 步</div>
            </div>
            <div class="text-right">
                <div class="text-xs text-gray-500">最终结果</div>
                <div id="totalText" class="text-2xl font-black text-indigo-600">0</div>
            </div>
        </div>
    </footer>

    <script>
        const STORAGE_KEY = 'offline_calc_advanced_items';

        function getItems() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        }

        function saveItems(items) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }

        function calculateSequence(items) {
            let result = 0;
            return items.map((item, index) => {
                const val = parseFloat(item.val);
                if (index === 0) {
                    result = val;
                } else {
                    if (item.op === '+') result += val;
                    else if (item.op === '-') result -= val;
                    else if (item.op === '×') result *= val;
                    else if (item.op === '÷') result = val !== 0 ? result / val : result;
                }
                return { ...item, runningTotal: result };
            });
        }

        function render() {
            const rawItems = getItems();
            const listEl = document.getElementById('itemList');
            const totalEl = document.getElementById('totalText');
            const countEl = document.getElementById('countText');
            const printTimeEl = document.getElementById('printTime');

            if (printTimeEl) {
                printTimeEl.innerText = '生成时间：' + new Date().toLocaleString('zh-CN');
            }

            if (rawItems.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-400 text-sm py-12">暂无计算记录，请输入数字进行运算</p>';
                totalEl.innerText = '0';
                countEl.innerText = '共 0 步';
                return;
            }

            const calculatedItems = calculateSequence(rawItems);
            const finalResult = calculatedItems[calculatedItems.length - 1].runningTotal;

            listEl.innerHTML = calculatedItems.map((item, idx) => {
                const val = parseFloat(item.val);
                const opText = idx === 0 ? '初始' : item.op;
                
                let opBg = 'bg-gray-100 text-gray-700';
                if (item.op === '+') opBg = 'bg-indigo-100 text-indigo-700';
                if (item.op === '-') opBg = 'bg-emerald-100 text-emerald-700';
                if (item.op === '×') opBg = 'bg-amber-100 text-amber-700';
                if (item.op === '÷') opBg = 'bg-rose-100 text-rose-700';

                return `
                    <div class="item-card flex items-center justify-between p-2.5 bg-gray-50 rounded-xl">
                        <div class="flex items-center gap-2.5">
                            <span class="w-7 h-7 rounded-lg ${opBg} text-xs font-bold flex items-center justify-center">${opText}</span>
                            <div>
                                <div class="font-bold text-gray-800 text-sm">${item.op} ${val.toLocaleString()}</div>
                                ${item.remark ? `<div class="text-xs text-gray-500 font-medium">${item.remark}</div>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="text-right">
                                <div class="text-[10px] text-gray-400">结果</div>
                                <div class="font-semibold text-gray-700 text-sm">${Number(item.runningTotal.toFixed(4)).toLocaleString()}</div>
                            </div>
                            <button onclick="deleteItem(${idx})" class="text-gray-300 hover:text-red-500 text-xs p-1 no-print">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.innerText = Number(finalResult.toFixed(4)).toLocaleString();
            countEl.innerText = `共 ${rawItems.length} 步`;
        }

        function addOp(op) {
            const numInput = document.getElementById('numberInput');
            const remarkInput = document.getElementById('remarkInput');
            const val = numInput.value;
            if (!val) return;

            const items = getItems();
            items.push({ op, val, remark: remarkInput.value.trim() });
            saveItems(items);

            numInput.value = '';
            remarkInput.value = '';
            numInput.focus();
            render();
        }

        function deleteItem(index) {
            const items = getItems();
            items.splice(index, 1);
            saveItems(items);
            render();
        }

        function clearAllRecords() {
            if (confirm('确定要清空目前的计算明细吗？')) {
                localStorage.removeItem(STORAGE_KEY);
                render();
            }
        }

        // 针对 iOS Safari 专门绑定的点击事件监听
        document.addEventListener('DOMContentLoaded', () => {
            render();
            const pdfBtn = document.getElementById('pdfBtn');
            if (pdfBtn) {
                pdfBtn.addEventListener('click', () => {
                    setTimeout(() => {
                        window.print();
                    }, 50);
                });
            }
        });
    </script>
</body>
</html>
