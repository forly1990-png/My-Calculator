<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="高级明细计算器">
    <title>高级明细计算器</title>
    
    <!-- 引入样式与离线 PDF 生成库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        input { font-size: 16px !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col font-sans">

    <!-- 顶部导航栏 -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-base font-bold flex items-center gap-1.5">🧮 多功能流水计算器</h1>
        <div class="flex gap-2">
            <button onclick="exportPDF()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-2.5 py-1.5 rounded-lg border border-indigo-400 font-medium transition">
                📄 导出 PDF
            </button>
            <button onclick="clearAllRecords()" class="text-xs bg-red-500 hover:bg-red-600 px-2.5 py-1.5 rounded-lg font-medium transition">
                清空
            </button>
        </div>
    </header>

    <!-- 主体区域 -->
    <main class="flex-1 p-4 max-w-lg mx-auto w-full flex flex-col space-y-4">

        <!-- 输入与运算操作区 -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-gray-100 space-y-3">
            <div>
                <input type="number" step="any" id="numberInput" placeholder="输入数字..." required class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-xl font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <!-- 四则运算按钮组 -->
            <div class="grid grid-cols-4 gap-2">
                <button onclick="addOp('+')" class="bg-indigo-600 active:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-lg shadow transition">
                    + 加
                </button>
                <button onclick="addOp('-')" class="bg-emerald-600 active:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-lg shadow transition">
                    - 减
                </button>
                <button onclick="addOp('×')" class="bg-amber-500 active:bg-amber-600 text-white font-bold py-2.5 rounded-xl text-lg shadow transition">
                    × 乘
                </button>
                <button onclick="addOp('÷')" class="bg-rose-500 active:bg-rose-600 text-white font-bold py-2.5 rounded-xl text-lg shadow transition">
                    ÷ 除
                </button>
            </div>

            <!-- 备注输入 -->
            <div>
                <input type="text" id="remarkInput" placeholder="添加备注说明（选填）" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
        </div>

        <!-- 明细列表区域 -->
        <div class="flex-1 bg-white rounded-2xl shadow-sm p-4 border border-gray-100 flex flex-col min-h-[300px]">
            <div class="flex justify-between items-center pb-2 mb-2 border-b text-xs text-gray-400 font-medium">
                <span>步骤 / 运算 / 备注</span>
                <span>当前累积结果</span>
            </div>

            <!-- 列表容器 -->
            <div id="itemList" class="flex-1 overflow-y-auto space-y-2 max-h-[45vh] pr-1">
                <p class="text-center text-gray-400 text-sm py-12">暂无计算记录，请输入数字进行运算</p>
            </div>
        </div>

    </main>

    <!-- 底部固定汇总栏 -->
    <footer class="bg-white border-t border-gray-200 p-4 sticky bottom-0 shadow-lg">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div>
                <div class="text-xs text-gray-500">步骤统计</div>
                <div id="countText" class="text-sm font-semibold text-gray-700">共 0 步</div>
            </div>
            <div class="text-right">
                <div class="text-xs text-gray-500">最终结果</div>
                <div id="totalText" class="text-2xl font-black text-indigo-600">0</div>
            </div>
        </div>
    </footer>

    <!-- 逻辑脚本 -->
    <script>
        const STORAGE_KEY = 'offline_calc_advanced_items';

        function getItems() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        }

        function saveItems(items) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        }

        // 重新按顺序计算全局累加结果
        function calculateSequence(items) {
            let result = 0;
            return items.map((item, index) => {
                const val = parseFloat(item.val);
                if (index === 0) {
                    result = val; // 第一笔为初始值
                } else {
                    if (item.op === '+') result += val;
                    else if (item.op === '-') result -= val;
                    else if (item.op === '×') result *= val;
                    else if (item.op === '÷') result = val !== 0 ? result / val : result;
                }
                return { ...item, runningTotal: result };
            });
        }

        // 渲染页面
        function render() {
            const rawItems = getItems();
            const listEl = document.getElementById('itemList');
            const totalEl = document.getElementById('totalText');
            const countEl = document.getElementById('countText');

            if (rawItems.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-400 text-sm py-12">暂无计算记录，请输入数字进行运算</p>';
                totalEl.innerText = '0';
                countEl.innerText = '共 0 步';
                return;
            }

            const calculatedItems = calculateSequence(rawItems);
            const finalResult = calculatedItems[calculatedItems.length - 1].runningTotal;

            // 显示时倒序排列，方便看最新操作
            const displayItems = [...calculatedItems].reverse();

            listEl.innerHTML = displayItems.map((item, displayIdx) => {
                const originalIdx = calculatedItems.length - 1 - displayIdx;
                const val = parseFloat(item.val);
                const opText = originalIdx === 0 ? '初始' : item.op;
                
                let opBg = 'bg-gray-100 text-gray-700';
                if (item.op === '+') opBg = 'bg-indigo-100 text-indigo-700';
                if (item.op === '-') opBg = 'bg-emerald-100 text-emerald-700';
                if (item.op === '×') opBg = 'bg-amber-100 text-amber-700';
                if (item.op === '÷') opBg = 'bg-rose-100 text-rose-700';

                return `
                    <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-xl hover:bg-gray-100 transition">
                        <div class="flex items-center gap-2.5">
                            <span class="w-7 h-7 rounded-lg ${opBg} text-xs font-bold flex items-center justify-center">${opText}</span>
                            <div>
                                <div class="font-bold text-gray-800 text-sm">${item.op} ${val.toLocaleString()}</div>
                                ${item.remark ? `<div class="text-[10px] text-gray-400">${item.remark}</div>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="text-right">
                                <div class="text-xs text-gray-400">结果</div>
                                <div class="font-semibold text-gray-700 text-sm">${Number(item.runningTotal.toFixed(4)).toLocaleString()}</div>
                            </div>
                            <button onclick="deleteItem(${originalIdx})" class="text-gray-300 hover:text-red-500 text-xs p-1">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.innerText = Number(finalResult.toFixed(4)).toLocaleString();
            countEl.innerText = `共 ${rawItems.length} 步`;
        }

        // 执行加减乘除
        function addOp(op) {
            const numInput = document.getElementById('numberInput');
            const remarkInput = document.getElementById('remarkInput');
            const val = numInput.value;
            if (!val) return;

            const items = getItems();
            items.push({ op, val, remark: remarkInput.value.trim() });
            saveItems(items);

            numInput.value = '';
            remarkInput.value = '';
            numInput.focus();
            render();
        }

        function deleteItem(index) {
            const items = getItems();
            items.splice(index, 1);
            saveItems(items);
            render();
        }

        function clearAllRecords() {
            if (confirm('确定要清空目前的计算明细吗？')) {
                localStorage.removeItem(STORAGE_KEY);
                render();
            }
        }

        // 导出 PDF 功能
        function exportPDF() {
            const rawItems = getItems();
            if (rawItems.length === 0) {
                alert('暂无数据可导出！');
                return;
            }

            const calculatedItems = calculateSequence(rawItems);
            const finalResult = calculatedItems[calculatedItems.length - 1].runningTotal;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // 标题
            doc.setFontSize(16);
            doc.text("计算明细与统计报表", 14, 20);
            
            doc.setFontSize(10);
            doc.text(`导出时间: ${new Date().toLocaleString('zh-CN')}`, 14, 28);
            doc.text(`总步骤数: ${rawItems.length} 步`, 14, 34);
            doc.text(`最终结果: ${Number(finalResult.toFixed(4)).toLocaleString()}`, 14, 40);

            // 表格数据构建
            const tableBody = calculatedItems.map((item, idx) => [
                `第 ${idx + 1} 步`,
                idx === 0 ? '初始数值' : item.op,
                item.val,
                item.remark || '-',
                Number(item.runningTotal.toFixed(4)).toLocaleString()
            ]);

            doc.autoTable({
                startY: 46,
                head: [['步骤', '运算符', '输入数值', '备注说明', '当前结果']],
                body: tableBody,
                styles: { fontSize: 9 },
                headStyles: { fillColor: [79, 70, 229] }
            });

            doc.save(`计算明细表_${new Date().toISOString().slice(0,10)}.pdf`);
        }

        window.onload = render;
    </script>
</body>
</html>
